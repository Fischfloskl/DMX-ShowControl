<div class="card">

    <h3>Global Trigger Timing</h3>

    <div style="text-align: center;">
            <h2>Hotkey</h2>
        <button
            id="hotkeyButton1"
            class="btna"
            onclick="startPlayKeyRecording()">
            Record Trigger-Hotkey
        </button>

        <p id="hotkeyDisplay1">
            {% if timing_global_playkey %}
            Current key: {{ timing_global_playkey | capitalize }}
            {% else %}
            No Hotkey
            {% endif %}
        </p>

        <button
            id="hotkeyButton2"
            class="btna"
            onclick="startSimKeyRecording()">
            Record simulated Hotkey
        </button>

        <p id="hotkeyDisplay2">
            {% if timing_global_simkey %}
            Current key: {{ timing_global_simkey | capitalize }}
            {% else %}
            No Hotkey
            {% endif %}
        </p>

    </div>


    <div
        id="timer-global"
        style="
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            margin: 30px 0;
        "
    >
        0.000 s
    </div>
    
    <div
        style="
            display: flex;
            gap: 10px;
            justify-content: center;">
        <button
            id="copyButton"
            class="btna"
            onclick="copyTimerglobal(this)">
            Copy
        </button>
        <button
            id="recordButton"
            class="btn-primary"
            onclick="toggleTimerglobal()">
            Record
        </button>

        <button
            class="btn-secondary"
            onclick="resetTimerglobal()">
            Reset
        </button>
        <select
            id="unitSelect"
            onchange="updateDisplayglobal()"
            class="btna">

            <option value="ms">
                Milliseconds
            </option>

            <option value="s" selected>
                Seconds
            </option>

            <option value="min">
                Minutes
            </option>

        </select>
    </div>


    <div style="margin-top: 20px;">

        

    </div>

</div>
<script src="{{ url_for('static', filename='js/timing.js') }}"></script>
